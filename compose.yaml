services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lerevenu}
      POSTGRES_USER: ${POSTGRES_USER:-lerevenu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Lancez npm run setup}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: apps/api/.env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-lerevenu}
      DATABASE_USERNAME: ${POSTGRES_USER:-lerevenu}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_ENV: production
      # Démonstration locale uniquement, exposée sur l’interface de boucle locale.
      ALLOW_DEMO_IN_PRODUCTION: 'true'
    ports:
      - '127.0.0.1:1337:1337'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:1337/api/categories').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      STRAPI_URL: http://api:1337
      NODE_ENV: production
      SESSION_SECURE: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
